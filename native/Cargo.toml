[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/platform", "crates/app", "crates/cli"]
[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.24.0", features = ["v4"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
subtle = "=2.6.1"
rusqlite = { version = "0.40", features = ["bundled"] }
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Collections", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Storage", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs"] }
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
